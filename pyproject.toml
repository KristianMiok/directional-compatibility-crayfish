[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcc"
version = "0.1.0"
description = "Directional ecological compatibility framework for freshwater crayfish"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kristian Miok" },
    { name = "Lucian Pârvulescu" },
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "xarray>=2024.1",
    "h5py>=3.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "click>=8.1",
    "the-new-hotness>=1.4.1",
    "pyarrow>=24.0.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6",
    "ruff>=0.3",
    "black>=24.0",
    "ipython>=8.20",
    "jupyterlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length handled by black

[tool.black]
line-length = 100
target-version = ["py311"]
