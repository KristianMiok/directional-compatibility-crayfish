paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  external_dir: data/external
  reports_dir: reports/stage1
  woc_occurrences: data/raw/combined_data_true_master.csv

filtering:
  high_accuracy_only: true
  max_snap_distance_m: 200
  dedup_strategy: segment

thresholds:
  values: [80, 200, 500]
  default: 200

env_coverage:
  native_only: true
  native_status_column: Status
  native_values: ["Native", "Type locality"]

env_variables:
  - name: bio1_annual_mean_temperature
    source: geofresh
    column: l_CLI3
  - name: bio6_min_temp_coldest_month
    source: geofresh
    column: l_CLI23
  - name: bio5_max_temp_warmest_month
    source: geofresh
    column: l_CLI19
  - name: bio4_temperature_seasonality
    source: geofresh
    column: l_CLI15
  - name: bio12_annual_precipitation
    source: geofresh
    column: l_CLI47
  - name: bio15_precipitation_seasonality
    source: geofresh
    column: l_CLI59
  - name: stream_gradient_mean
    source: geofresh
    column: l_TOP15
    scale_factor: 1.0e-6   # codebook annotation: "Scale = 10^6" — divide raw values by 1e6 to recover real units
  - name: subcatchment_mean_elevation
    source: geofresh
    column: l_TOP122

basin_overlap:
  basin_id_column: basin_id

invasion_audit:
  native_values: ["Native", "Type locality"]

logging:
  level: INFO
  file: logs/stage1.log
